<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Книгарня BookShelf — SPA</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <header class="bg-dark text-white py-3 shadow-sm mb-4">
    <div class="container d-flex justify-content-between align-items-center">
      <h1 class="h3 m-0"> BookShelf</h1>
      <nav>
        <a href="#" id="link-home" class="btn btn-outline-light me-2">Додому</a>
        <button id="btn-catalog" class="btn btn-warning fw-semibold">Каталог книг</button>
      </nav>
    </div>
  </header>

  <!-- Головний блок динамічного контенту -->
  <main class="container" id="main-content">
    <div class="text-center py-5">
      <h2 class="fw-bold">Вітаємо в онлайн-книгарні BookShelf!</h2>
      <p class="text-muted fs-5">Обирайте жанри та знаходьте найкращі книги для читання.</p>
      <button class="btn btn-primary btn-lg mt-3" onclick="document.getElementById('btn-catalog').click()">
        Перейти до каталогу
      </button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
