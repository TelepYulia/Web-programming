<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Hunt Game</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Панель налаштувань -->
  <div class="controls" id="setup-panel">
    <label>
      Choose difficulty:
      <select id="difficulty-select">
        <option value="">--Please choose an option--</option>
        <option value="lazy">Lazy</option>
        <option value="normal">Normal</option>
        <option value="hard">Catch me if you can</option>
      </select>
    </label>

    <label>
      Choose color:
      <select id="color-select">
        <option value="">--Please choose an option--</option>
        <option value="red">Red</option>
        <option value="green">Green</option>
        <option value="blue">Blue</option>
      </select>
    </label>

    <button id="start-btn">Start</button>
  </div>

  <div class="title">Pixel Hunt</div>

  <!-- Панель статистики -->
  <div class="stats-panel" id="stats-panel">
    <div>score: <span id="score-val">0</span></div>
    <div>time left for click: <span id="timer-val">0</span></div>
  </div>

  <!-- Ігровий блок -->
  <div id="target-box"></div>

  <script src="script.js"></script>
</body>
</html>
